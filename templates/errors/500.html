{% extends "base.html" %}
{% block title %}500 Server Error | {{ jktta.SHORT_NAME }}{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <h1 class="display-3 fw-bold text-danger">500</h1>

</div>
{% endblock %}
