{% extends "base.html" %}
{% block title %}Set New Password | {{ jktta.SHORT_NAME }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="jk-card p-4 p-md-5 mx-auto" style="max-width: 450px; border-top: 4px solid var(--jk-gold);">
        <h3 class="mb-3 text-center">Set New Password</h3>
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label fw-semibold">New Password (min 8 chars)</label>
                <input type="password" name="password" minlength="8" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Confirm New Password</label>
                <input type="password" name="confirm_password" minlength="8" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-jk-gold w-100">Update Password</button>
        </form>
    </div>
</div>
{% endblock %}
