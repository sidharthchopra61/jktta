{% extends "base.html" %}
{% block title %}Forgot Password | {{ jktta.SHORT_NAME }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="jk-card p-4 p-md-5 mx-auto" style="max-width: 450px; border-top: 4px solid var(--jk-gold);">
        <h3 class="mb-2 text-center">Reset Password</h3>
        <p class="text-muted small text-center mb-4">Enter your registered email address to receive a password reset link.</p>
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label fw-semibold">Email Address</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-jk-navy w-100">Send Reset Link</button>
        </form>
    </div>
</div>
{% endblock %}
