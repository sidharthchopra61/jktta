{% extends "base.html" %}
{% block title %}Member Login | {{ jktta.SHORT_NAME }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="jk-card p-4 p-md-5 mx-auto" style="max-width: 460px; border-top: 4px solid var(--jk-gold);">
        <div class="text-center mb-4">
            <span class="jk-brand-emblem mb-2"><i class="bi bi-shield-lock-fill"></i></span>
            <h3 class="mb-1">Member &amp; Staff Login</h3>
            <p class="text-muted small">Access your JKTTA Player or Administrative Dashboard</p>
        </div>
        <form method="post" action="{{ url_for('login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label fw-semibold">Email Address</label>
                <input type="email" name="email" class="form-control" required autofocus>
            </div>
            <div class="mb-2">
                <label class="form-label fw-semibold">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="remember" id="rememberMe">
                    <label class="form-check-label small" for="rememberMe">Keep me signed in</label>
                </div>
                <a href="{{ url_for('forgot_password') }}" class="small">Forgot password?</a>
            </div>
            <button type="submit" class="btn btn-jk-navy w-100">Sign In</button>
        </form>
        <div class="text-center mt-3 small">
            New athlete? <a href="{{ url_for('register') }}" class="fw-semibold">Register as a Player</a>
        </div>
    </div>
</div>
{% endblock %}
